# Temporary prototype balance. Server owns these settings. Reload: /differentenchant reload
max_machine_tier=5
default_machine_tier=1
# Whole-machine scan: 80 possible positions, at most 36 effective shelves.
# Scale is now a soft knee (1..36), not a cap. Existing scale=15 keeps its base gain.
bookshelf_scale=15
# Diminishing gain above the knee (0.01..1), added until the fixed 36-shelf cap.
bookshelf_tail_gain=0.5
rarity.tier=0.35
rarity.shelves=0.8
rarity.option=0.2
level.base=-4.0
level.tier=0.8
level.shelves=2.0
level.option=0.6
extra.base=0.15
extra.tier=0.04
extra.shelves=0.15
extra.option=0.1
max_enchantments=4
# Vanilla operation: require the displayed level, spend 1/2/3 levels AND lapis.
required_level.1=5
required_level.2=15
required_level.3=30
# Optional per-registry-ID type multiplier, 0 disables; positive range 0.01..100.
# Java properties keys must escape the colon. Not a whitelist.
# type_multiplier.example\:enchantment=1.0

# Directed enchanting temporary costs: each step is clamped to 5..8 experience levels.
# Requires level >=30 AND enough levels for the complete batch. No remaining-30 requirement.
directed.base=5
directed.rarity=1.5
directed.target=1.5
directed.tier_discount=0.5
directed.allow_treasure=false
directed.allow_curses=false
