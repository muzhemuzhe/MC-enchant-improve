plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'differentenchant' }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
test { useJUnitPlatform() }

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}
loom {
    mods {
        differentenchant { sourceSet sourceSets.main }
        differentenchant_tests { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            name 'Differentenchant GameTest'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get()}/gametest-results.xml"
            runDir 'build/gametest'
        }
        clientGametest {
            client()
            name 'Differentenchant Client GameTest'
            source sourceSets.gametest
            vmArg '-Dfabric.client.gametest'
            runDir 'build/client-gametest'
        }
    }
}
