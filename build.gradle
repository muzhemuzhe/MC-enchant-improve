plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'differentenchant' }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
test { useJUnitPlatform() }

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

// Scope visual iterations to ruins without changing the committed test entrypoints.
tasks.named('processGametestResources') {
    def disenchantIntegrated = providers.gradleProperty('disenchantIntegrated').isPresent()
    inputs.property('disenchantIntegrated', disenchantIntegrated)
    def disenchantOnly = providers.gradleProperty('disenchantOnly').isPresent()
    inputs.property('disenchantOnly', disenchantOnly)
    def ruinsOnly = providers.gradleProperty('ruinsOnly').isPresent()
    def smallReview = providers.gradleProperty('smallReview').isPresent()
    def mediumReview = providers.gradleProperty('mediumReview').isPresent()
    def lanternOnly = providers.gradleProperty('lanternOnly').isPresent()
    def researchOnly = providers.gradleProperty('researchOnly').isPresent()
    def lostBatchIntegrated = providers.gradleProperty('lostBatchIntegrated').isPresent()
    inputs.property('lostBatchIntegrated', lostBatchIntegrated)
    def lostBatchTwo = providers.gradleProperty('lostBatchTwo').isPresent()
    inputs.property('lostBatchTwo', lostBatchTwo)
    def researchGui = providers.gradleProperty('researchGui').isPresent()
    def researchAffected = providers.gradleProperty('researchAffected').isPresent()
    inputs.property('ruinsOnly', ruinsOnly)
    inputs.property('smallReview', smallReview)
    inputs.property('mediumReview', mediumReview)
    inputs.property('lanternOnly', lanternOnly)
    inputs.property('researchOnly', researchOnly)
    inputs.property('researchGui', researchGui)
    inputs.property('researchAffected', researchAffected)
    doLast {
        if (ruinsOnly || smallReview || mediumReview || lanternOnly || researchOnly || researchGui || lostBatchTwo || disenchantOnly) {
            def metadata = new File(destinationDir, 'fabric.mod.json')
            def parsed = new groovy.json.JsonSlurper().parse(metadata)
            parsed.entrypoints['fabric-gametest'] = smallReview || mediumReview ? [] : ['dev.differentenchant.RuinGameTests']
            parsed.entrypoints['fabric-client-gametest'] = mediumReview ? ['dev.differentenchant.MediumRuinReviewClientGameTest'] : smallReview ? ['dev.differentenchant.SmallRuinReviewClientGameTest'] : ['dev.differentenchant.RuinClientGameTest']
            if (lanternOnly) {
                parsed.entrypoints['fabric-gametest'] = ['dev.differentenchant.LanternGameTests']
                parsed.entrypoints['fabric-client-gametest'] = ['dev.differentenchant.LanternClientGameTest']
            }
            if (researchOnly || researchGui) {
                parsed.entrypoints['fabric-gametest'] = ['dev.differentenchant.ResearchGameTests', 'dev.differentenchant.LostEffectsGameTests', 'dev.differentenchant.research.ResearchPersistenceGameTests']
                if (researchGui) parsed.entrypoints['fabric-gametest'] = ['dev.differentenchant.ResearchGameTests', 'dev.differentenchant.research.ResearchPersistenceGameTests']
                if (researchAffected) parsed.entrypoints['fabric-gametest'] += ['dev.differentenchant.ResearchIntegrationGameTests']
                parsed.entrypoints['fabric-client-gametest'] = ['dev.differentenchant.ResearchClientGameTest']
            }
            if (lostBatchTwo) {
                parsed.entrypoints['fabric-gametest'] = ['dev.differentenchant.BatchTwoGameTests']
                parsed.entrypoints['fabric-client-gametest'] = ['dev.differentenchant.BatchTwoClientGameTest']
                if (lostBatchIntegrated) {
                    parsed.entrypoints['fabric-gametest'] += ['dev.differentenchant.ResearchGameTests', 'dev.differentenchant.LostEffectsGameTests', 'dev.differentenchant.research.ResearchPersistenceGameTests']
                    parsed.entrypoints['fabric-client-gametest'] += ['dev.differentenchant.ResearchClientGameTest']
                }
            }
            if (disenchantOnly) {
                parsed.entrypoints['fabric-gametest'] = ['dev.differentenchant.DisenchantGameTests']
                if (disenchantIntegrated) parsed.entrypoints['fabric-gametest'] += ['dev.differentenchant.ResearchIntegrationGameTests', 'dev.differentenchant.DisenchantIntegrationGameTests']
                parsed.entrypoints['fabric-client-gametest'] = ['dev.differentenchant.DisenchantClientGameTest']
            }
            metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(parsed))
        }
    }
}
loom {
    mods {
        differentenchant { sourceSet sourceSets.main }
        differentenchant_tests { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            name 'Differentenchant GameTest'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get()}/gametest-results.xml"
            runDir 'build/gametest'
        }
        clientGametest {
            client()
            name 'Differentenchant Client GameTest'
            source sourceSets.gametest
            vmArg '-Dfabric.client.gametest'
            runDir 'build/client-gametest'
        }
    }
}
